[pytest]
# Configuration pytest pour Marketplace

# Répertoire des tests
testpaths = tests

# Options par défaut
addopts = 
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short

# Patterns de fichiers de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers personnalisés
markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    slow: Tests lents
    auth: Tests d'authentification
    products: Tests de produits
    cart: Tests de panier
    orders: Tests de commandes

# Couverture minimale
# Décommenter pour forcer une couverture minimale
# [coverage:report]
# fail_under = 70
